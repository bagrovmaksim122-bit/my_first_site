<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Максим Багров</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md navbar-dark main-nav">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Максим Багров</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">О проекте</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contacts.html">Контакты</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-head py-5">
      <div class="container">
        <h1 class="display-6 fw-bold">Контакты</h1>
        <p class="lead mb-0">Буду рад вопросам и предложениям</p>
      </div>
    </section>

    <section class="container py-5">
      <div class="row g-4">
        <div class="col-12 col-md-5">
          <div class="card contact-card p-4 shadow-sm h-100">
            <h2 class="h5 mb-3">Как со мной связаться</h2>
            <ul class="list-unstyled contact-list mb-0">
              <li><span>🎓</span> ВГУ, факультет компьютерных наук</li>
              <li><span>📍</span> Воронеж</li>
              <li><span>💻</span> <a href="https://github.com/bagrovmaksim122-bit">bagrovmaksim122-bit</a></li>
            </ul>
          </div>
        </div>

        <div class="col-12 col-md-7">
          <div class="card p-4 shadow-sm">
            <h2 class="h5 mb-3">Написать сообщение</h2>
            <form class="row g-3" action="#" onsubmit="return false;">
              <div class="col-12 col-sm-6">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" placeholder="Иван">
              </div>
              <div class="col-12 col-sm-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="ivan@mail.ru">
              </div>
              <div class="col-12">
                <label for="message" class="form-label">Сообщение</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Ваш вопрос"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary">Отправить</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer py-4">
    <div class="container text-center">
      <p class="mb-0">© 2026 Максим Багров · Учебный проект по веб-технологиям</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
